name: build-image

# 手动触发，或打 v* 标签时自动跑。
# 产物推到 GHCR；用仓库自带的 GITHUB_TOKEN 推送，GHCR 会把包和仓库关联起来，
# 之后包才能设成 public（用户手动 docker push 创建的包是“游离”的，关联不上）。
on:
  workflow_dispatch:
    inputs:
      ffmpeg_url:
        description: "ffmpeg.exe 下载地址（gyan.dev essentials build）"
        required: false
        default: "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
  push:
    tags: ["v*"]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/caijimao-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 取后端载荷（Release 资产）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p payload
          gh release download v4.3.0 --repo "$GITHUB_REPOSITORY" \
            --pattern 'caijimao-4.3.0-payload.zip' --dir /tmp/payload
          unzip -q /tmp/payload/caijimao-4.3.0-payload.zip -d payload
          ls -l payload/app

      - name: 取 ffmpeg.exe（体积原因不在 Release 里）
        run: |
          set -euo pipefail
          URL="${{ github.event.inputs.ffmpeg_url }}"
          [ -z "$URL" ] && URL="https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          curl -fsSL "$URL" -o /tmp/ffmpeg.zip
          unzip -q -j /tmp/ffmpeg.zip '*/bin/ffmpeg.exe' -d /tmp/ff
          cp /tmp/ff/ffmpeg.exe payload/app/ffmpeg.exe
          ls -l payload/app/ffmpeg.exe

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:4.3.0
            ${{ env.IMAGE }}:latest

      # 关联过的包才能通过 API 改可见性；这一步失败也不影响镜像本身
      - name: 把包设为 public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH "/user/packages/container/caijimao-web" \
            -f visibility=public || \
          gh api --method PATCH "/users/${{ github.repository_owner }}/packages/container/caijimao-web" \
            -f visibility=public || true
